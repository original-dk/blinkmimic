[build-system]
requires = ["uv_build>=0.8.19,<0.10.0"]
build-backend = "uv_build"

[project]
name = "blinkmimic"
version = "1.0.0"
description = "BlinkMimic: whole-body motion tracking for the Unitree G1 with one differentiable world model, in minutes on one GPU."
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [{ name = "Fuyi Chen" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "genesis-world==1.4.5",
  "mujoco>=3.3.0",
  "torch>=2.7.0",
  "matplotlib",
  "pillow",
]

[project.optional-dependencies]
export = ["onnx", "onnxscript"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# CUDA 12.8 torch (Blackwell-capable); pinned to versions tested with this code.
constraint-dependencies = ["torch==2.9.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
